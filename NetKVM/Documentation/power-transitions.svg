<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 560" role="img" aria-labelledby="title desc">
<title id="title">Two NetKVM power-transition paths</title>
<desc id="desc">With NDIS Pause, Running goes through Paused and Suspended, then Paused and Running after Restart. Without Pause, Running goes directly to FastSuspend and back to Running. Both paths use the same VirtIO power-down operation.</desc>
<defs>
  <marker id="normal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <marker id="off-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  <marker id="on-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172334; }
  .state { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
  .power-state { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
  .title { font-size: 23px; font-weight: 700; }
  .lane { font-size: 19px; font-weight: 700; }
  .name { font-size: 20px; font-weight: 700; text-anchor: middle; }
  .detail { font-size: 15px; fill: #475569; text-anchor: middle; }
  .note { font-size: 16px; fill: #475569; }
  .event { font-size: 15px; font-weight: 700; text-anchor: middle; }
  .normal { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#normal-arrow); }
  .off { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#off-arrow); }
  .on { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#on-arrow); }
</style>
<rect width="1340" height="560" fill="#fff"/>
<text x="50" y="47" class="title">Same device power-down; two NDIS callback sequences</text>
<text x="50" y="83" class="note">D0 and D1/D2/D3 are device-power states; Running, Paused, Suspended, and FastSuspend are NetKVM states.</text>
<text x="50" y="137" class="lane">NDIS pauses first</text>
<rect x="50" y="175" width="170" height="82" rx="12" class="state"/><text x="135" y="208" class="name">Running</text><text x="135" y="236" class="detail">D0 · RX/TX active</text>
<rect x="315" y="175" width="170" height="82" rx="12" class="state"/><text x="400" y="208" class="name">Paused</text><text x="400" y="236" class="detail">D0 · RX/TX stopped</text>
<rect x="580" y="175" width="170" height="82" rx="12" class="power-state"/><text x="665" y="208" class="name">Suspended</text><text x="665" y="236" class="detail">D1/D2/D3</text>
<rect x="845" y="175" width="170" height="82" rx="12" class="state"/><text x="930" y="208" class="name">Paused</text><text x="930" y="236" class="detail">D0 · RX/TX stopped</text>
<rect x="1110" y="175" width="170" height="82" rx="12" class="state"/><text x="1195" y="208" class="name">Running</text><text x="1195" y="236" class="detail">D0 · RX/TX active</text>
<path d="M 220 218 H 315" class="normal"/><text x="267" y="194" class="event">Pause</text>
<path d="M 485 218 H 580" class="off"/><text x="532" y="194" class="event">non-D0 OID</text>
<path d="M 750 218 H 845" class="on"/><text x="797" y="194" class="event">D0 OID</text>
<path d="M 1015 218 H 1110" class="normal"/><text x="1062" y="194" class="event">Restart</text>
<text x="50" y="333" class="lane">NDIS skips Pause/Restart</text>
<rect x="50" y="370" width="255" height="82" rx="12" class="state"/><text x="177" y="403" class="name">Running</text><text x="177" y="431" class="detail">D0 · RX/TX active</text>
<rect x="542" y="370" width="255" height="82" rx="12" class="power-state"/><text x="669" y="403" class="name">FastSuspend</text><text x="669" y="431" class="detail">D1/D2/D3 · RX/TX stopped</text>
<rect x="1034" y="370" width="255" height="82" rx="12" class="state"/><text x="1161" y="403" class="name">Running</text><text x="1161" y="431" class="detail">D0 · RX/TX active</text>
<path d="M 305 412 H 542" class="off"/><text x="423" y="391" class="event">non-D0 OID · stop RX/TX</text>
<path d="M 797 412 H 1034" class="on"/><text x="915" y="391" class="event">D0 OID · start RX/TX</text>
<text x="50" y="518" class="note">The difference is the miniport state on entry to the power OID, not the requested Dx level.</text>
</svg>
