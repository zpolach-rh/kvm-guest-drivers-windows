<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">NetKVM functional architecture</title>
<desc id="desc">NDIS is at the top. TX and RX paths sit in the middle of NetKVM, with initialization and common core to their left and control to their right. NetKVM VirtIO abstractions, the shared VirtIO library, the virtio-net device, and QEMU are below. Blue arrows carry TX downward and green arrows carry RX upward.</desc>
<defs>
  <marker id="tx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker>
  <marker id="rx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  <marker id="ctl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #172334; }
  .frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
  .subframe { fill: #eef4fb; stroke: #a2b8d0; stroke-width: 2; }
  .box { fill: #ffffff; stroke: #475569; stroke-width: 2; }
  .title { font-size: 20px; font-weight: 700; }
  .label { font-size: 18px; font-weight: 700; text-anchor: middle; }
  .detail { font-size: 14px; text-anchor: middle; fill: #475569; }
  .edge-label { font-size: 15px; font-weight: 700; }
  .tx-label { fill: #1d4ed8; text-anchor: end; }
  .rx-label { fill: #15803d; text-anchor: start; }
  .tx { fill: none; stroke: #1d4ed8; stroke-width: 4; marker-end: url(#tx-arrow); }
  .rx { fill: none; stroke: #15803d; stroke-width: 4; marker-end: url(#rx-arrow); }
  .ctl { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#ctl-arrow); }
  .support { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 6; }
</style>
<rect width="1200" height="1040" fill="#ffffff"/>
<rect x="50" y="160" width="1100" height="450" rx="12" class="frame"/>
<text x="78" y="197" class="title">NetKVM miniport</text>
<rect x="320" y="385" width="820" height="175" rx="12" class="subframe"/>
<path d="M 490 125 V 208 H 460 V 240" class="tx"/>
<path d="M 740 240 V 208 H 710 V 125" class="rx"/>
<path d="M 820 80 H 1025 V 250" class="ctl"/>
<path d="M 460 340 V 440" class="tx"/>
<path d="M 740 440 V 340" class="rx"/>
<path d="M 1025 330 V 440" class="ctl"/>
<path d="M 460 525 V 625 H 520 V 660" class="tx"/>
<path d="M 680 660 V 625 H 740 V 525" class="rx"/>
<path d="M 1025 525 V 700 H 780" class="ctl"/>
<path d="M 520 740 V 800" class="tx"/>
<path d="M 680 800 V 740" class="rx"/>
<path d="M 520 880 V 925" class="tx"/>
<path d="M 680 925 V 880" class="rx"/>
<path d="M 175 330 V 365" class="support"/>
<rect x="380" y="35" width="440" height="90" rx="12" class="box"/>
<text x="600.0" y="80.0" class="label">Windows network stack / NDIS</text>
<rect x="80" y="250" width="190" height="80" rx="12" class="box"/>
<text x="175.0" y="283.0" class="label">Initialization</text>
<text x="175.0" y="309.0" class="detail">lifecycle and setup</text>
<rect x="80" y="365" width="190" height="85" rx="12" class="box"/>
<text x="175.0" y="400.5" class="label">Common core</text>
<text x="175.0" y="426.5" class="detail">adapter state and helpers</text>
<rect x="350" y="240" width="220" height="100" rx="12" class="box"/>
<text x="460.0" y="283.0" class="label">TX path</text>
<text x="460.0" y="309.0" class="detail">NDIS to device</text>
<rect x="630" y="240" width="220" height="100" rx="12" class="box"/>
<text x="740.0" y="283.0" class="label">RX path</text>
<text x="740.0" y="309.0" class="detail">device to NDIS</text>
<rect x="930" y="250" width="190" height="80" rx="12" class="box"/>
<text x="1025.0" y="283.0" class="label">OID / control</text>
<text x="1025.0" y="309.0" class="detail">configuration</text>
<rect x="350" y="440" width="220" height="85" rx="12" class="box"/>
<text x="460.0" y="475.5" class="label">TX queue wrapper</text>
<text x="460.0" y="501.5" class="detail">CTXVirtQueue</text>
<rect x="630" y="440" width="220" height="85" rx="12" class="box"/>
<text x="740.0" y="475.5" class="label">RX queue wrapper</text>
<text x="740.0" y="501.5" class="detail">CVirtQueue</text>
<rect x="930" y="440" width="190" height="85" rx="12" class="box"/>
<text x="1025.0" y="475.5" class="label">Control queue</text>
<text x="1025.0" y="501.5" class="detail">CParaNdisCX</text>
<rect x="420" y="660" width="360" height="80" rx="12" class="box"/>
<text x="600.0" y="693.0" class="label">Shared VirtIO library</text>
<text x="600.0" y="719.0" class="detail">virtiolib.lib</text>
<rect x="420" y="800" width="360" height="80" rx="12" class="box"/>
<text x="600.0" y="840.0" class="label">virtio-net PCI device</text>
<rect x="420" y="925" width="360" height="80" rx="12" class="box"/>
<text x="600.0" y="965.0" class="label">QEMU / host network backend</text>
<text x="440" y="195" class="edge-label tx-label">TX</text>
<text x="760" y="195" class="edge-label rx-label">RX</text>
<text x="930" y="71" class="edge-label">OID / control</text>
<text x="440" y="605" class="edge-label tx-label">TX</text>
<text x="760" y="605" class="edge-label rx-label">RX</text>
<text x="500" y="780" class="edge-label tx-label">TX</text>
<text x="700" y="780" class="edge-label rx-label">RX</text>
</svg>
